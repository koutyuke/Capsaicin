name: Capsaicin
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, ja]
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  CapsaicinKit:
    path: Packages/CapsaicinKit
targets:
  Capsaicin:
    type: application
    platform: macOS
    sources:
      - path: Sources/Capsaicin
        # XcodeGen 2.44 は syncedFolder だけでは Resources フェーズを作らない。
        # ディレクトリ指定で新規 Swift ファイルと String Catalog の両方を取り込む。
        type: group
        excludes:
          - Resources/capsaicin.icon
      # Icon Composer の .icon はディレクトリのまま追加すると中身が個別のリソースに
      # なり actool が走らない。1 ファイルとして Resources に入れる。
      # createIntermediateGroups がないと中間の Resources グループが接続されず、
      # パスがリポジトリ直下に解決されて actool が失敗する。
      - path: Sources/Capsaicin/Resources/capsaicin.icon
        type: file
        buildPhase: resources
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.koutyuke.capsaicin
        # XcodeGen はアプリターゲットに既定で AppIcon を設定する。
        # ファイル名に合わせて上書きする（SPEC-UI-009）。
        ASSETCATALOG_COMPILER_APPICON_NAME: capsaicin
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Capsaicin
        INFOPLIST_FILE: Sources/Capsaicin/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.koutyuke.capsaicin.debug
          SPARKLE_FEED_URL: ""
          SPARKLE_PUBLIC_ED_KEY: ""
        Release:
          SPARKLE_FEED_URL: https://github.com/koutyuke/Capsaicin/releases/latest/download/appcast.xml
          SPARKLE_PUBLIC_ED_KEY: "j11dFPcM5gV6ikr2GJQLThZvg98/AcJGcYPkfCKDjac="
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: CapsaicinKit
        product: CapsaicinCore
      - package: CapsaicinKit
        product: CapsaicinIPC
      - package: CapsaicinKit
        product: CapsaicinPlatform
      - target: CapsaicinCLI
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # CLI と同じ非公開の実行ファイル置き場。インストールや特権付与はしない。
      - target: capsaicin-helper
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postBuildScripts:
      # CodeSign より前に生成し、構成ごとの定義もアプリの署名に含める。
      - name: Generate bundled daemon definition
        script: |
          set -eu
          directory="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          label="${PRODUCT_BUNDLE_IDENTIFIER}.helper"
          /bin/mkdir -p "$directory"
          plist="$directory/$label.plist"
          /usr/bin/plutil -create xml1 "$plist"
          /usr/bin/plutil -insert Label -string "$label" "$plist"
          /usr/bin/plutil -insert BundleProgram -string Contents/Helpers/capsaicin-helper "$plist"
          /usr/bin/plutil -insert MachServices -xml "<dict><key>$label</key><true/></dict>" "$plist"
          /usr/bin/plutil -insert RunAtLoad -bool true "$plist"
          /usr/bin/plutil -lint "$plist"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(PRODUCT_BUNDLE_IDENTIFIER).helper.plist
  CapsaicinCLI:
    productName: capsaicin
    type: tool
    platform: macOS
    sources:
      - path: Sources/capsaicin-cli
        type: syncedFolder
    settings:
      base:
        PRODUCT_NAME: capsaicin
        PRODUCT_MODULE_NAME: CapsaicinCLI
        PRODUCT_BUNDLE_IDENTIFIER: io.github.koutyuke.capsaicin.cli
        # tool の ad-hoc 署名は bundle ID だけでは識別子が固定されない。
        OTHER_CODE_SIGN_FLAGS: "$(inherited) --identifier $(PRODUCT_BUNDLE_IDENTIFIER)"
    dependencies:
      - package: CapsaicinKit
        product: CapsaicinIPC
      - package: CapsaicinKit
        product: CapsaicinCore
  capsaicin-helper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/capsaicin-helper
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.koutyuke.capsaicin.helper
        OTHER_CODE_SIGN_FLAGS: "$(inherited) --identifier $(PRODUCT_BUNDLE_IDENTIFIER)"
        GCC_C_LANGUAGE_STANDARD: c17
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CLANG_ENABLE_MODULES: YES
        OTHER_CFLAGS: ["$(inherited)", "-fblocks"]
      configs:
        Debug:
          GCC_PREPROCESSOR_DEFINITIONS:
            - $(inherited)
            - HELPER_APP_IDENTIFIER=\"io.github.koutyuke.capsaicin.debug\"
            - HELPER_SERVICE_NAME=\"io.github.koutyuke.capsaicin.debug.helper\"
        Release:
          GCC_PREPROCESSOR_DEFINITIONS:
            - $(inherited)
            - HELPER_APP_IDENTIFIER=\"io.github.koutyuke.capsaicin\"
            - HELPER_SERVICE_NAME=\"io.github.koutyuke.capsaicin.helper\"
  CapsaicinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CapsaicinTests
        type: syncedFolder
      - path: Sources/capsaicin-cli/CLIApplication.swift
      - path: Sources/capsaicin-cli/CLIOutput.swift
      - path: Sources/capsaicin-cli/CLIRunner.swift
      - path: Sources/capsaicin-cli/CLISystem.swift
      # アプリを起動せずに画面とモデルをテストするため、入口（@main）以外のアプリのソースを含める。
      - path: Sources/Capsaicin
        type: group
        excludes:
          - MenuBar/CapsaicinApp.swift
          # テストバンドルへ .icon の中身をコピーさせない。
          - Resources/capsaicin.icon
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: Capsaicin
      - package: CapsaicinKit
        product: CapsaicinIPC
      - package: CapsaicinKit
        product: CapsaicinCore
      - package: CapsaicinKit
        product: CapsaicinCoreTesting
      - package: CapsaicinKit
        product: CapsaicinPlatform
    settings:
      base:
        # テストバンドルの Asset Catalog から独自シンボルを読むには bundle ID が要る。
        PRODUCT_BUNDLE_IDENTIFIER: io.github.koutyuke.capsaicin.tests
        # ホストアプリを起動せず、生成したバンドルを検査する。
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  Capsaicin:
    build:
      targets:
        Capsaicin: all
    test:
      targets:
        - CapsaicinTests
