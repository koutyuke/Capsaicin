name: dmgbuild
description: DMG の見た目を作る dmgbuild を、flake.lock で固定した版で Nix から入れる（DEC-SYS-028）。
runs:
  using: composite
  steps:
    # Xcode の Python は 3.9 で、dmgbuild が求める 3.10 以上に足りない。devShell 全体は評価しない。
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
    - name: Install dmgbuild
      shell: bash
      run: |
        set -euo pipefail
        nix build .#dmgbuild --out-link "$RUNNER_TEMP/dmgbuild"
        echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
