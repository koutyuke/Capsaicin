# リリースの方針は docs/meta/decisions/DEC-SYS-015-pull-request-ci-and-release-on-merge.md、
# 手順は docs/manual/release.md にある。
name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && github.run_id || 'preview' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview-start:
    name: Mark release preview building
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # コメント処理は、この実行のワークフローと同じコミットから読む。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Mark release preview building
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_KIND: release
          PREVIEW_STATE: building
        run: python3 scripts/preview_comment.py

  preview-package:
    name: Package release preview
    needs: [preview-start]
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/build-tools
      # 使い捨てのランナーなので、開発機と違って Xcode の選択を変えてよい。
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        run: echo "version=$(just --evaluate version)" >> "$GITHUB_OUTPUT"
      - name: Package
        run: just dist
      # .build は隠しフォルダーなので、送るファイルを名前で指定して隠しファイルの除外を外す。
      - name: Upload unsigned release preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/SHA256SUMS.txt

  sign-and-notarize:
    name: Sign and notarize
    needs: [preview-package, release-package]
    # 確認用と公開用のどちらかのビルドだけが動くので、片方が skipped でも進める。
    # always() だと取り消された実行でも動くため、!cancelled() にする。
    if: >-
      !cancelled() &&
      (needs.preview-package.result == 'success' || needs.release-package.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/sign-and-notarize.yml
    with:
      input-artifact: ${{ github.event.action == 'closed' && 'unsigned-release-dist' || 'unsigned-release-preview' }}
      zip-name: Capsaicin-${{ needs.release-package.outputs.version || needs.preview-package.outputs.version }}.zip
    secrets:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}

  preview-comment:
    name: Comment release preview
    needs: [preview-start, preview-package, sign-and-notarize]
    if: >-
      !cancelled() &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Update release preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_KIND: release
          PREVIEW_STATE: ${{ needs.preview-package.result == 'success' && needs.sign-and-notarize.result == 'success' && 'ready' || 'failed' }}
          ARTIFACT_URL: ${{ needs.sign-and-notarize.outputs.artifact_url }}
          PACKAGE_NAME: ${{ needs.sign-and-notarize.outputs.dmg_name }}
          VERSION: ${{ needs.preview-package.outputs.version }}
        run: python3 scripts/preview_comment.py

  release-package:
    name: Package release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sparkle_version: ${{ steps.version.outputs.sparkle_version }}
      sparkle_sha256: ${{ steps.version.outputs.sparkle_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/build-tools
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        run: |
          source .github/build-tools.env
          {
            echo "version=$(just --evaluate version)"
            echo "sparkle_version=$SPARKLE_VERSION"
            echo "sparkle_sha256=$SPARKLE_SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Require unused version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
      - name: Package
        run: just dist
      - name: Require increasing build number
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          def get(path, accept="application/vnd.github+json"):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": accept},
              )
              return urllib.request.urlopen(request).read()

          try:
              latest = json.loads(get("releases/latest"))
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("No latest release; skipping build-number comparison")
          else:
              tag = latest["tag_name"]
              ref = urllib.parse.quote(tag, safe="")
              project = get(f"contents/project.yml?ref={ref}", "application/vnd.github.raw+json").decode()
              previous = re.findall(r'^\s+CURRENT_PROJECT_VERSION: "([0-9]+)"\s*$', project, re.MULTILINE)
              if len(previous) != 1:
                  raise SystemExit("Cannot read a unique CURRENT_PROJECT_VERSION at the latest tag")
              with zipfile.ZipFile(f".build/dist/Capsaicin-{os.environ['VERSION']}.zip") as archive:
                  info = plistlib.loads(archive.read("Capsaicin.app/Contents/Info.plist"))
              current = str(info["CFBundleVersion"])
              if not re.fullmatch(r"[0-9]+", current) or int(current) <= int(previous[0]):
                  raise SystemExit(f"CFBundleVersion {current} must be greater than {previous[0]} ({tag})")
              print(f"Build number {current} > {previous[0]} ({tag})")
          PY
      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/SHA256SUMS.txt

  release-appcast:
    name: Sign release appcast
    needs: [release-package, sign-and-notarize]
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-package.outputs.version }}
      DMG_NAME: ${{ needs.sign-and-notarize.outputs.dmg_name }}
    steps:
      # checkout やリポジトリ内の処理を実行せず、秘密鍵をビルドから隔離する。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.DMG_NAME }}
          path: dist
      - name: Install Sparkle tools
        env:
          SPARKLE_VERSION: ${{ needs.release-package.outputs.sparkle_version }}
          SPARKLE_SHA256: ${{ needs.release-package.outputs.sparkle_sha256 }}
        run: |
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          printf '%s  %s\n' "$SPARKLE_SHA256" "$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$tools"
      - name: Check DMG and write release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          shopt -s nullglob
          images=(dist/*.dmg)
          if [[ ${#images[@]} -ne 1 || "${images[0]}" != "dist/Capsaicin-$VERSION.dmg" ]]; then
            echo '::error::Expected exactly the release DMG'
            exit 1
          fi

          # マウント先のフォルダーは diskutil が作り、取り外すときに消す。
          mount_point="$RUNNER_TEMP/capsaicin-mount"
          diskutil image attach --readOnly --nobrowse --mountPoint "$mount_point" "${images[0]}"
          trap 'diskutil eject "$mount_point"' EXIT

          python3 - "$mount_point/Capsaicin.app/Contents/Info.plist" <<'PY'
          import base64
          import os
          import plistlib
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]
          with Path(sys.argv[1]).open("rb") as info_plist:
              info = plistlib.load(info_plist)
          public_key = info.get("SUPublicEDKey", "").strip()
          if not public_key or len(base64.b64decode(public_key, validate=True)) != 32:
              raise SystemExit("The release app must have a nonempty 32-byte SUPublicEDKey")
          body = os.environ["PR_BODY"]
          if not body.strip():
              raise SystemExit("The pull request body is empty")
          Path(f"dist/Capsaicin-{version}.md").write_text(body + "\n", encoding="utf-8")
          PY
      # 秘密鍵はこのステップだけに渡し、ファイルやコマンドの引数には書かない。
      - name: Generate signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set"
            exit 1
          fi
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/koutyuke/Capsaicin/releases/download/v$VERSION/" \
            -o dist/appcast.xml dist
      - name: Require archive and feed signatures
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = Path("dist/appcast.xml").read_bytes()
          items = ET.fromstring(data).findall("./channel/item")
          if len(items) != 1:
              raise SystemExit("The appcast must contain exactly one item")
          enclosure = items[0].find("enclosure")
          if enclosure is None:
              raise SystemExit("The appcast item must have an enclosure")
          signature = enclosure.get("{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature", "")
          if len(base64.b64decode(signature, validate=True)) != 64:
              raise SystemExit("The appcast item must have sparkle:edSignature (check the signing key)")
          version = os.environ["VERSION"]
          expected_url = f"https://github.com/koutyuke/Capsaicin/releases/download/v{version}/{os.environ['DMG_NAME']}"
          if enclosure.get("url") != expected_url:
              raise SystemExit("The appcast must point to the release DMG at its tag URL")
          signing_block = re.search(
              rb"<!-- sparkle-signatures:\nedSignature: ([A-Za-z0-9+/]{86}==)\nlength: ([0-9]+)\n-->\n?\Z", data
          )
          if signing_block is None or int(signing_block[2]) != signing_block.start():
              raise SystemExit("The appcast must have a feed signature (check SURequireSignedFeed)")
          print("One item, archive signature, tag URL, and feed signature checked")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-appcast
          if-no-files-found: error
          retention-days: 7
          path: dist/appcast.xml

  publish:
    name: Publish
    needs: [release-package, sign-and-notarize, release-appcast]
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DMG_NAME: ${{ needs.sign-and-notarize.outputs.dmg_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.DMG_NAME }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-appcast
          path: dist
      - name: Write DMG checksum
        working-directory: dist
        run: sha256sum "$DMG_NAME" > SHA256SUMS.txt
      - name: Write release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "::error::The pull request body is empty"
            exit 1
          fi
          printf '%s\n' "$PR_BODY" > release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.DMG_NAME }}
      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ needs.release-package.outputs.version }}
        run: |
          args=(--target "$MERGE_SHA" --notes-file release-notes.md --title "Capsaicin $VERSION")
          # プレリリースにするかは、版ではなく PR のラベルで決める（DEC-SYS-016）。
          if jq -e 'any(.pull_request.labels[]; .name == "S-Prerelease")' "$GITHUB_EVENT_PATH" >/dev/null; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            "dist/$DMG_NAME" \
            dist/SHA256SUMS.txt \
            dist/appcast.xml \
            "${args[@]}"
