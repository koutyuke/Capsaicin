# リリースの方針は docs/meta/decisions/DEC-SYS-015-pull-request-ci-and-release-on-merge.md、
# 手順は docs/manual/release.md にある。
name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && github.run_id || 'preview' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview-package:
    name: Package release preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/build-tools
      # 使い捨てのランナーなので、開発機と違って Xcode の選択を変えてよい。
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        run: echo "version=$(just --evaluate version)" >> "$GITHUB_OUTPUT"
      - name: Package
        run: just dist
      # .build は隠しフォルダーなので、送るファイルを名前で指定して隠しファイルの除外を外す。
      - name: Upload unsigned release preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/SHA256SUMS.txt

  sign-and-notarize:
    name: Sign and notarize
    needs: [preview-package, release-package]
    # 確認用と公開用のどちらかのビルドだけが動くので、片方が skipped でも進める。
    # always() だと取り消された実行でも動くため、!cancelled() にする。
    if: >-
      !cancelled() &&
      (needs.preview-package.result == 'success' || needs.release-package.result == 'success')
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    env:
      VERSION: ${{ needs.release-package.outputs.version || needs.preview-package.outputs.version }}
    steps:
      - name: Set temporary paths
        run: |
          {
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/capsaicin-signing.keychain-db"
            echo "KEYCHAIN_LIST_PATH=$RUNNER_TEMP/capsaicin-keychain-list.txt"
            echo "P12_PATH=$RUNNER_TEMP/capsaicin-developer-id.p12"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APP_PATH=$RUNNER_TEMP/capsaicin-package/Capsaicin.app"
            echo "NOTARY_ARCHIVE_PATH=$RUNNER_TEMP/Capsaicin-notarization.zip"
          } >> "$GITHUB_ENV"
      # どの secret が不足しているかを、秘密情報を使う前にまとめて示す。
      - name: Require signing secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          missing=()
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            NOTARY_API_KEY \
            NOTARY_API_KEY_ID \
            NOTARY_API_ISSUER_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required secret: %s\n' "${missing[@]}"
            exit 1
          fi
      # checkout せず、ビルドジョブが作った ad-hoc 署名の zip だけを受け取る。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.action == 'closed' && 'unsigned-release-dist' || 'unsigned-release-preview' }}
          path: dist
      - name: Check unsigned package
        run: |
          archives=(dist/*.zip)
          if [[ ${#archives[@]} -ne 1 || "${archives[0]}" != "dist/Capsaicin-$VERSION.zip" ]]; then
            echo '::error::Expected exactly the versioned release zip'
            exit 1
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
      - name: Create temporary signing keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -hex 32)"
          security list-keychains -d user |
            sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/' > "$KEYCHAIN_LIST_PATH"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$P12_PATH"
          chmod 600 "$P12_PATH"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH" >/dev/null

          keychains=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && keychains+=("$keychain")
          done < "$KEYCHAIN_LIST_PATH"
          keychains+=("$KEYCHAIN_PATH")
          security list-keychains -d user -s "${keychains[@]}"

          identity_count="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              grep -F -c '"Developer ID Application:' || true
          )"
          if [[ "$identity_count" != 1 ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity; found $identity_count (check the .p12 and the Developer ID G2 intermediate certificate)"
            exit 1
          fi
      - name: Sign app from the inside out
        run: |
          mkdir -p "$(dirname "$APP_PATH")"
          ditto -x -k "dist/Capsaicin-$VERSION.zip" "$(dirname "$APP_PATH")"
          [[ -d "$APP_PATH" ]] || { echo '::error::Capsaicin.app is missing'; exit 1; }

          sparkle="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          sign=(codesign --force --timestamp --options runtime --keychain "$KEYCHAIN_PATH" --sign "Developer ID Application")
          "${sign[@]}" --identifier io.github.koutyuke.capsaicin.cli \
            "$APP_PATH/Contents/Helpers/capsaicin"
          "${sign[@]}" --identifier io.github.koutyuke.capsaicin.helper \
            "$APP_PATH/Contents/Helpers/capsaicin-helper"
          "${sign[@]}" "$sparkle/Versions/B/XPCServices/Installer.xpc"
          "${sign[@]}" --preserve-metadata=entitlements \
            "$sparkle/Versions/B/XPCServices/Downloader.xpc"
          "${sign[@]}" "$sparkle/Versions/B/Autoupdate"
          "${sign[@]}" "$sparkle/Versions/B/Updater.app"
          "${sign[@]}" "$sparkle"
          "${sign[@]}" "$APP_PATH"

          codesign --verify --strict --deep --verbose=2 "$APP_PATH"
      - name: Write notarization key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
      - name: Submit for notarization
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ARCHIVE_PATH"
          set +e
          result="$(
            xcrun notarytool submit "$NOTARY_ARCHIVE_PATH" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER_ID" \
              --wait \
              --output-format json
          )"
          command_status=$?
          set -e
          printf '%s\n' "$result"

          submission_id="$(jq -r '.id // empty' <<< "$result" 2>/dev/null || true)"
          notarization_status="$(jq -r '.status // empty' <<< "$result" 2>/dev/null || true)"
          if [[ $command_status -ne 0 || "$notarization_status" != Accepted ]]; then
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$NOTARY_KEY_PATH" \
                --key-id "$NOTARY_API_KEY_ID" \
                --issuer "$NOTARY_API_ISSUER_ID" || true
            fi
            echo "::error::Notarization was not accepted (status: ${notarization_status:-unknown})"
            exit 1
          fi
      - name: Staple and validate
        run: |
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          if ! assessment="$(spctl --assess --type execute -vv "$APP_PATH" 2>&1)"; then
            printf '%s\n' "$assessment"
            exit 1
          fi
          printf '%s\n' "$assessment"
          if ! grep -F 'source=Notarized Developer ID' <<< "$assessment" >/dev/null; then
            echo '::error::Gatekeeper assessment did not report source=Notarized Developer ID'
            exit 1
          fi
      - name: Repackage signed app
        run: |
          mkdir -p signed-dist
          ditto -c -k --norsrc --noextattr --noacl --keepParent \
            "$APP_PATH" "signed-dist/Capsaicin-$VERSION.zip"
          (cd signed-dist && shasum -a 256 "Capsaicin-$VERSION.zip" > SHA256SUMS.txt)
      - name: Upload signed release package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.action == 'closed' && 'release-dist' || 'release-preview' }}
          if-no-files-found: error
          retention-days: 7
          path: |
            signed-dist/Capsaicin-${{ env.VERSION }}.zip
            signed-dist/SHA256SUMS.txt
      - name: Clean up signing credentials
        if: always()
        run: |
          if [[ -f "$KEYCHAIN_LIST_PATH" ]]; then
            keychains=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && keychains+=("$keychain")
            done < "$KEYCHAIN_LIST_PATH"
            security list-keychains -d user -s "${keychains[@]}" || true
          fi
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f \
            "$KEYCHAIN_PATH" \
            "$KEYCHAIN_LIST_PATH" \
            "$P12_PATH" \
            "$NOTARY_KEY_PATH" \
            "$NOTARY_ARCHIVE_PATH"

  preview-comment:
    name: Comment release preview
    needs: [preview-package, sign-and-notarize]
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update release preview comment
        env:
          ARTIFACT_URL: ${{ needs.sign-and-notarize.outputs.artifact_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- capsaicin-release-preview -->'
          body="$marker
          ## Release preview

          - [Download the artifact]($ARTIFACT_URL)
          - Built commit: \`$COMMIT_SHA\`
          - Signing: Developer ID (notarized and stapled)"

          comment_id="$(
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | select(.body | contains("<!-- capsaicin-release-preview -->")) | .id' |
              sed -n '1p'
          )"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body"
          fi

  release-package:
    name: Package release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sparkle_version: ${{ steps.version.outputs.sparkle_version }}
      sparkle_sha256: ${{ steps.version.outputs.sparkle_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/build-tools
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        run: |
          source .github/build-tools.env
          {
            echo "version=$(just --evaluate version)"
            echo "sparkle_version=$SPARKLE_VERSION"
            echo "sparkle_sha256=$SPARKLE_SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Require unused version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
      - name: Package
        run: just dist
      - name: Require increasing build number
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          def get(path, accept="application/vnd.github+json"):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": accept},
              )
              return urllib.request.urlopen(request).read()

          try:
              latest = json.loads(get("releases/latest"))
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("No latest release; skipping build-number comparison")
          else:
              tag = latest["tag_name"]
              ref = urllib.parse.quote(tag, safe="")
              project = get(f"contents/project.yml?ref={ref}", "application/vnd.github.raw+json").decode()
              previous = re.findall(r'^\s+CURRENT_PROJECT_VERSION: "([0-9]+)"\s*$', project, re.MULTILINE)
              if len(previous) != 1:
                  raise SystemExit("Cannot read a unique CURRENT_PROJECT_VERSION at the latest tag")
              with zipfile.ZipFile(f".build/dist/Capsaicin-{os.environ['VERSION']}.zip") as archive:
                  info = plistlib.loads(archive.read("Capsaicin.app/Contents/Info.plist"))
              current = str(info["CFBundleVersion"])
              if not re.fullmatch(r"[0-9]+", current) or int(current) <= int(previous[0]):
                  raise SystemExit(f"CFBundleVersion {current} must be greater than {previous[0]} ({tag})")
              print(f"Build number {current} > {previous[0]} ({tag})")
          PY
      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/SHA256SUMS.txt

  release-appcast:
    name: Sign release appcast
    needs: [release-package, sign-and-notarize]
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-package.outputs.version }}
    steps:
      # checkout やリポジトリ内の処理を実行せず、秘密鍵をビルドから隔離する。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Install Sparkle tools
        env:
          SPARKLE_VERSION: ${{ needs.release-package.outputs.sparkle_version }}
          SPARKLE_SHA256: ${{ needs.release-package.outputs.sparkle_sha256 }}
        run: |
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          printf '%s  %s\n' "$SPARKLE_SHA256" "$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$tools"
      - name: Check archive and write release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import plistlib
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          archives = list(Path("dist").glob("*.zip"))
          if archives != [Path(f"dist/Capsaicin-{version}.zip")]:
              raise SystemExit("Expected exactly the release zip")
          with zipfile.ZipFile(archives[0]) as archive:
              info = plistlib.loads(archive.read("Capsaicin.app/Contents/Info.plist"))
          public_key = info.get("SUPublicEDKey", "").strip()
          if not public_key or len(base64.b64decode(public_key, validate=True)) != 32:
              raise SystemExit("The release app must have a nonempty 32-byte SUPublicEDKey")
          body = os.environ["PR_BODY"]
          if not body.strip():
              raise SystemExit("The pull request body is empty")
          Path(f"dist/Capsaicin-{version}.md").write_text(body + "\n", encoding="utf-8")
          PY
      # 秘密鍵はこのステップだけに渡し、ファイルやコマンドの引数には書かない。
      - name: Generate signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set"
            exit 1
          fi
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/koutyuke/Capsaicin/releases/download/v$VERSION/" \
            -o dist/appcast.xml dist
      - name: Require archive and feed signatures
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = Path("dist/appcast.xml").read_bytes()
          items = ET.fromstring(data).findall("./channel/item")
          if len(items) != 1:
              raise SystemExit("The appcast must contain exactly one item")
          enclosure = items[0].find("enclosure")
          if enclosure is None:
              raise SystemExit("The appcast item must have an enclosure")
          signature = enclosure.get("{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature", "")
          if len(base64.b64decode(signature, validate=True)) != 64:
              raise SystemExit("The appcast item must have sparkle:edSignature (check the signing key)")
          version = os.environ["VERSION"]
          expected_url = f"https://github.com/koutyuke/Capsaicin/releases/download/v{version}/Capsaicin-{version}.zip"
          if enclosure.get("url") != expected_url:
              raise SystemExit("The appcast must point to the release zip at its tag URL")
          signing_block = re.search(
              rb"<!-- sparkle-signatures:\nedSignature: ([A-Za-z0-9+/]{86}==)\nlength: ([0-9]+)\n-->\n?\Z", data
          )
          if signing_block is None or int(signing_block[2]) != signing_block.start():
              raise SystemExit("The appcast must have a feed signature (check SURequireSignedFeed)")
          print("One item, archive signature, tag URL, and feed signature checked")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-appcast
          if-no-files-found: error
          retention-days: 7
          path: dist/appcast.xml

  publish:
    name: Publish
    needs: [release-package, sign-and-notarize, release-appcast]
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-appcast
          path: dist
      - name: Write release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "::error::The pull request body is empty"
            exit 1
          fi
          printf '%s\n' "$PR_BODY" > release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Capsaicin-${{ needs.release-package.outputs.version }}.zip
      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ needs.release-package.outputs.version }}
        run: |
          args=(--target "$MERGE_SHA" --notes-file release-notes.md --title "Capsaicin $VERSION")
          # プレリリースにするかは、版ではなく PR のラベルで決める（DEC-SYS-016）。
          if jq -e 'any(.pull_request.labels[]; .name == "S-Prerelease")' "$GITHUB_EVENT_PATH" >/dev/null; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            "dist/Capsaicin-$VERSION.zip" \
            dist/SHA256SUMS.txt \
            dist/appcast.xml \
            "${args[@]}"
