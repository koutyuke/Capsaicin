# リリースの方針は docs/meta/decisions/DEC-SYS-011-github-actions-ci-and-release.md、
# 手順は docs/manual/release.md にある。
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # 使い捨てのランナーなので、開発機と違って Xcode の選択を変えてよい。
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(nix develop --command just --evaluate version)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check
        run: nix develop --command just check
      - name: Package
        run: nix develop --command just dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=(--verify-tag --notes-from-tag --title "Capsaicin $VERSION")
          # 1.0.0 未満は、公開の前提を確かめ終えていない版としてプレリリースにする。
          if [[ "$VERSION" == 0.* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" \
            ".build/dist/Capsaicin-$VERSION.zip" \
            .build/dist/SHA256SUMS.txt \
            "${args[@]}"
