# リリースの方針は docs/meta/decisions/DEC-SYS-013-ci-and-release-workflows.md、
# 手順は docs/manual/release.md にある。
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Release ビルドは CI の結果に依存しないので、CI と並列に作る。公開は両方が通ってから。
  package:
    name: Package
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-tools
      # 使い捨てのランナーなので、開発機と違って Xcode の選択を変えてよい。
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(just --evaluate version)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package
        run: just dist
      # .build は隠しフォルダーなので、送るファイルを名前で指定して隠しファイルの除外を外す。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/SHA256SUMS.txt

  publish:
    name: Publish
    needs: [ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # --notes-from-tag が注釈付きタグの本文を手元の Git から読む。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Capsaicin-${{ needs.package.outputs.version }}.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          args=(--verify-tag --notes-from-tag --title "Capsaicin $VERSION")
          # 1.0.0 未満は、公開の前提を確かめ終えていない版としてプレリリースにする。
          if [[ "$VERSION" == 0.* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/Capsaicin-$VERSION.zip" \
            dist/SHA256SUMS.txt \
            "${args[@]}"
