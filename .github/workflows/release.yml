# リリースの方針は docs/meta/decisions/DEC-SYS-015-pull-request-ci-and-release-on-merge.md、
# 手順は docs/manual/release.md にある。
name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && github.run_id || 'preview' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview-package:
    name: Package release preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/build-tools
      # 使い捨てのランナーなので、開発機と違って Xcode の選択を変えてよい。
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        run: echo "version=$(just --evaluate version)" >> "$GITHUB_OUTPUT"
      - name: Package
        run: just dist
      # .build は隠しフォルダーなので、送るファイルを名前で指定して隠しファイルの除外を外す。
      - name: Upload release preview
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/SHA256SUMS.txt

  preview-comment:
    name: Comment release preview
    needs: preview-package
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update release preview comment
        env:
          ARTIFACT_URL: ${{ needs.preview-package.outputs.artifact_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- capsaicin-release-preview -->'
          body="$marker
          ## Release preview

          - [Download the artifact]($ARTIFACT_URL)
          - Built commit: \`$COMMIT_SHA\`
          - Signing: ad-hoc (not notarized)"

          comment_id="$(
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | select(.body | contains("<!-- capsaicin-release-preview -->")) | .id' |
              sed -n '1p'
          )"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body"
          fi

  release-package:
    name: Package release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/build-tools
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        run: echo "version=$(just --evaluate version)" >> "$GITHUB_OUTPUT"
      - name: Require unused version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
      - name: Package
        run: just dist
      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/SHA256SUMS.txt

  publish:
    name: Publish
    needs: release-package
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Write release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "::error::The pull request body is empty"
            exit 1
          fi
          printf '%s\n' "$PR_BODY" > release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Capsaicin-${{ needs.release-package.outputs.version }}.zip
      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ needs.release-package.outputs.version }}
        run: |
          args=(--target "$MERGE_SHA" --notes-file release-notes.md --title "Capsaicin $VERSION")
          # 1.0.0 未満は、公開の前提を確かめ終えていない版としてプレリリースにする。
          if [[ "$VERSION" == 0.* ]]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            "dist/Capsaicin-$VERSION.zip" \
            dist/SHA256SUMS.txt \
            "${args[@]}"
