# 方針は docs/meta/decisions/DEC-SYS-015-pull-request-ci-and-release-on-merge.md と
# docs/meta/decisions/DEC-SYS-029-separate-release-preview-and-publish-workflows.md、
# 手順は docs/manual/release.md にある。確認用のビルドは release-preview.yml が行う。
name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

# 公開の実行は取り消さず、待たせもしないので、concurrency を持たない。

jobs:
  release-package:
    name: Package release
    # 後続のジョブは if を持たず、このジョブが skipped なら既定の success() で一緒に skipped になる。
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sparkle_version: ${{ steps.version.outputs.sparkle_version }}
      sparkle_sha256: ${{ steps.version.outputs.sparkle_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/build-tools
      - uses: ./.github/actions/dmgbuild
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Read version
        id: version
        run: |
          source .github/build-tools.env
          {
            echo "version=$(just --evaluate version)"
            echo "sparkle_version=$SPARKLE_VERSION"
            echo "sparkle_sha256=$SPARKLE_SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Require unused version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
      - name: Package
        run: just dist
      - name: Require increasing build number
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          def get(path, accept="application/vnd.github+json"):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": accept},
              )
              return urllib.request.urlopen(request).read()

          try:
              latest = json.loads(get("releases/latest"))
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("No latest release; skipping build-number comparison")
          else:
              tag = latest["tag_name"]
              ref = urllib.parse.quote(tag, safe="")
              project = get(f"contents/project.yml?ref={ref}", "application/vnd.github.raw+json").decode()
              previous = re.findall(r'^\s+CURRENT_PROJECT_VERSION: "([0-9]+)"\s*$', project, re.MULTILINE)
              if len(previous) != 1:
                  raise SystemExit("Cannot read a unique CURRENT_PROJECT_VERSION at the latest tag")
              with zipfile.ZipFile(f".build/dist/Capsaicin-{os.environ['VERSION']}.zip") as archive:
                  info = plistlib.loads(archive.read("Capsaicin.app/Contents/Info.plist"))
              current = str(info["CFBundleVersion"])
              if not re.fullmatch(r"[0-9]+", current) or int(current) <= int(previous[0]):
                  raise SystemExit(f"CFBundleVersion {current} must be greater than {previous[0]} ({tag})")
              print(f"Build number {current} > {previous[0]} ({tag})")
          PY
      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .build/dist/Capsaicin-${{ steps.version.outputs.version }}.zip
            .build/dist/Capsaicin-layout.dmg
            .build/dist/SHA256SUMS.txt

  sign-and-notarize:
    name: Sign and notarize
    needs: [release-package]
    permissions:
      contents: read
    uses: ./.github/workflows/sign-and-notarize.yml
    with:
      input-artifact: unsigned-release-dist
      zip-name: Capsaicin-${{ needs.release-package.outputs.version }}.zip
    secrets:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}

  release-appcast:
    name: Sign release appcast
    needs: [release-package, sign-and-notarize]
    permissions:
      contents: read
    uses: ./.github/workflows/release-appcast.yml
    with:
      version: ${{ needs.release-package.outputs.version }}
      dmg-name: ${{ needs.sign-and-notarize.outputs.dmg_name }}
      sparkle-version: ${{ needs.release-package.outputs.sparkle_version }}
      sparkle-sha256: ${{ needs.release-package.outputs.sparkle_sha256 }}
    secrets:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

  publish:
    name: Publish
    needs: [release-package, sign-and-notarize, release-appcast]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DMG_NAME: ${{ needs.sign-and-notarize.outputs.dmg_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.DMG_NAME }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-appcast
          path: dist
      - name: Write DMG checksum
        working-directory: dist
        run: sha256sum "$DMG_NAME" > SHA256SUMS.txt
      - name: Write release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "::error::The pull request body is empty"
            exit 1
          fi
          printf '%s\n' "$PR_BODY" > release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.DMG_NAME }}
      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ needs.release-package.outputs.version }}
        run: |
          args=(--target "$MERGE_SHA" --notes-file release-notes.md --title "Capsaicin $VERSION")
          # プレリリースにするかは、版ではなく PR のラベルで決める（DEC-SYS-016）。
          if jq -e 'any(.pull_request.labels[]; .name == "S-Prerelease")' "$GITHUB_EVENT_PATH" >/dev/null; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            "dist/$DMG_NAME" \
            dist/SHA256SUMS.txt \
            dist/appcast.xml \
            "${args[@]}"
