# 検査の方針とジョブの分け方は docs/meta/decisions/DEC-SYS-015-pull-request-ci-and-release-on-merge.md にある。
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  # PR は最新の実行だけを残す。push と手動実行は run_id ごとに別のグループになる。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 静的検査は多くのツールを使うので、手元と同じ Nix の devShell で動かす。
  lint:
    name: Format and lint
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # 使い捨てのランナーなので、開発機と違って Xcode の選択を変えてよい。
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Run fmt-check, lint and test-scripts
        run: nix develop --command just fmt-check lint test-scripts

  # テストに要るのは just と XcodeGen だけなので、Nix の評価（約1分）を省く。
  test:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      # 1つが落ちても残りを最後まで走らせ、失敗をまとめて見られるようにする。
      fail-fast: false
      matrix:
        include:
          - name: Package tests
            recipe: test-package
          - name: App tests
            recipe: test-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-tools
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Run ${{ matrix.recipe }}
        run: just ${{ matrix.recipe }}

  # CI の合否はこのジョブだけで判断する。どれかが失敗・取り消し・スキップなら失敗にする。
  passed:
    name: All checks passed
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
