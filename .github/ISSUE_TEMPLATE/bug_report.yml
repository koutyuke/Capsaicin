name: Bug report / 不具合の報告
description: Report something that does not work as expected. English or Japanese is fine. / 期待どおりに動かないことを報告します。英語でも日本語でも構いません。
labels: [T-Bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened / 起きたこと
      description: What you did, what you expected, and what happened instead. / 何をして、何を期待し、実際に何が起きたか。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現の手順
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Capsaicin version / Capsaicin の版
      description: The release version, or the commit if you built from source. / リリースの版。ソースからビルドした場合はコミット。
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Mac and macOS version / Mac の機種と macOS の版
      placeholder: MacBook Air (M3), macOS 26.1
    validations:
      required: true
  - type: textarea
    id: keyboards
    attributes:
      label: Keyboards and key remapping apps / キーボードとキー配列を変更するアプリ
      description: Keyboards in use and apps such as Karabiner-Elements, if any. / 使っているキーボードと、Karabiner-Elements などを使っていればその名前。
  - type: textarea
    id: logs
    attributes:
      label: Logs / ログ
      description: Remove any personal information before pasting. / 個人の情報は取り除いてから貼ってください。
      render: text
