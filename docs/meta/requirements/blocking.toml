schema = "requirement-set"
domain = "blocking"
domain_code = "BLK"

[[requirements]]
id = "REQ-BLK-001"
title = "自動スリープを止められる"
kind = "functional"
statement = "抑止中は、利用者が操作しなくても Mac が自動でスリープしない。"
reason = "長時間の処理や放置中の作業を中断させないため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-001"]
depends_on = []
sources = ["DEC-BLK-001", "DEC-BLK-006"]

[[requirements]]
id = "REQ-BLK-002"
title = "ディスプレイスリープとスクリーンセーバを止められる"
kind = "functional"
statement = "抑止中は、「ディスプレイを自動でオフにしない」をオンにしていれば、利用者が操作しなくてもディスプレイスリープせず、スクリーンセーバが自動で起動しない。"
reason = "画面を見ている間に、ディスプレイが自動でスリープしないようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-001"]
depends_on = []
sources = ["DEC-BLK-001", "DEC-BLK-006", "HYP-BLK-009"]

[[requirements]]
id = "REQ-BLK-003"
title = "手動スリープを止められる"
kind = "functional"
statement = "抑止中は、「ディスプレイを閉じたとき」が「スリープ」以外（蓋のない Mac では「メニューから選んでもスリープさせない」がオン）なら、利用者がスリープを指示しても Mac がスリープしない。"
reason = "誤ってスリープさせて処理を中断させないため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-001", "SPEC-BLK-012"]
depends_on = []
sources = ["DEC-BLK-001", "DEC-BLK-006"]

[[requirements]]
id = "REQ-BLK-004"
title = "蓋閉じスリープを止められる"
kind = "functional"
statement = "抑止中は、「ディスプレイを閉じたとき」が「スリープ」以外なら、蓋を閉じても Mac がスリープしない。"
reason = "蓋を閉じたまま処理を続けられるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-001", "SPEC-BLK-012"]
depends_on = []
sources = ["DEC-BLK-001", "DEC-BLK-006"]

[[requirements]]
id = "REQ-BLK-005"
title = "閉じたときにディスプレイスリープさせられる"
kind = "functional"
statement = "抑止中に「ディスプレイを閉じたとき」を「ディスプレイをオフ」にしていれば、蓋を閉じるとディスプレイスリープする。"
reason = "蓋閉じスリープを止めている間も、閉じた蓋の中で画面を点けたままにしないため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-002"]
depends_on = ["REQ-BLK-004"]
sources = ["DEC-BLK-002", "DEC-BLK-006"]

[[requirements]]
id = "REQ-BLK-006"
title = "時間の解除条件を開始時に指定できる"
kind = "functional"
statement = "抑止を開始するとき、時間の解除条件（タイマーと指定時刻）は設定の既定値を使い、メニューと CLI では開始ごとに指定した条件に置き換えられる。開始の要求では、時間の条件を持たないことも指定できる。"
reason = "普段の使い方は設定で決めておき、その場だけ違う時間で止めたいときに設定を変えずに済ませるため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-003"]
depends_on = []
sources = ["DEC-BLK-005", "DEC-BLK-009"]

[[requirements]]
id = "REQ-BLK-007"
title = "タイマーで解除できる"
kind = "functional"
statement = "タイマーを解除条件にして抑止を開始したら、指定した時間が過ぎた時点で抑止が解除される。"
reason = "止めたまま忘れても、決めた時間で自動的に元に戻すため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-004"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-BLK-008"
title = "指定時刻で解除できる"
kind = "functional"
statement = "時刻を解除条件にして抑止を開始したら、次に来るその時刻になった時点で抑止が解除される。"
reason = "夜通しの処理などを、終わる見込みの時刻まで止めておくため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-005"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-BLK-009"
title = "バッテリー残量で解除できる"
kind = "functional"
statement = "「バッテリー残量」の条件が有効なとき（オンで、電源アダプターにつながっていて無視する設定がオンの場合を除く）、バッテリー残量がしきい値を下回ったら抑止を解除し、開始時にすでに下回っていれば抑止を始めない。"
reason = "スリープを止めたまま電池を使い切らないようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-006", "SPEC-BLK-008", "SPEC-BLK-012"]
depends_on = []
sources = ["DEC-BLK-005", "HYP-BLK-005"]

[[requirements]]
id = "REQ-BLK-010"
title = "解除したらスリープ設定を元に戻す"
kind = "functional"
statement = "抑止を解除したら、止めていた種類のスリープは通常の動作に戻る。戻せなかったものは利用者に隠さずに伝え、戻るまで合わせ直す。Capsaicin が立てていないスリープの禁止には触れない（詳細は SPEC-BLK-007、SPEC-HLP-005）。"
reason = "抑止の終了後にスリープできない状態を残さないため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-007"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-BLK-011"
title = "電源アダプターにつながっている間はバッテリー残量で解除しないようにできる"
kind = "functional"
statement = "利用者は、電源アダプターにつながっている間はバッテリー残量の条件で解除しないように設定できる。"
reason = "充電しながら使っている間に、残量が少ないことを理由に抑止が解除されないようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-006"]
depends_on = ["REQ-BLK-009"]
sources = []

[[requirements]]
id = "REQ-BLK-012"
title = "抑止中に変えた設定をその場で反映する"
kind = "functional"
statement = "抑止中に設定を変えたら、開始時に決めた解除の時刻を除き、変えた設定をいまの抑止にその場で反映する。反映できなかった変更は確定せず、元の設定に戻したことを伝える（詳細は SPEC-BLK-009）。"
reason = "設定を変えた結果を、抑止をやり直さずに確かめられるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-009"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-BLK-013"
title = "開始に必要な仕組みをすべて適用できたときだけ抑止を始める"
kind = "functional"
statement = "抑止は、止めるスリープの設定に必要な仕組みをすべて適用できたときだけ始まり、一部しか適用できなければ始まらず、そのことと理由が利用者に伝わる。"
reason = "選んだスリープの一部だけが止まった状態を、抑止中と見せないため。"
priority = "must"
status = "accepted"
specs = ["SPEC-BLK-010"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-BLK-014"
title = "閉じたときにディスプレイスリープさせずに輝度を 0 にできる"
kind = "functional"
statement = "抑止中に「ディスプレイを閉じたとき」を「明るさを0」にしていれば、蓋を閉じると、ディスプレイスリープさせずに内蔵ディスプレイの輝度を 0 にし、蓋を開けたときや抑止を解除したときに元の輝度に戻す。"
reason = "閉じた蓋の中の光漏れを抑えながら、画面をロックさせずに画面収録や Computer Use を続けるため。"
priority = "should"
status = "accepted"
specs = ["SPEC-BLK-013"]
depends_on = ["REQ-BLK-004"]
sources = ["DEC-BLK-008"]

[[requirements]]
id = "REQ-BLK-015"
title = "抑止を続けたまま時間の解除条件を変えられる"
kind = "functional"
statement = "利用者は、抑止中にメニューと CLI で時間の解除条件を置き換えられる。置き換えで抑止は途切れない。"
reason = "オンにした後に時間を変えたいとき、一度オフにしてスリープ防止を外さずに済ませるため。"
priority = "should"
status = "accepted"
specs = ["SPEC-BLK-003", "SPEC-BLK-011", "SPEC-CLI-001", "SPEC-CLI-007", "SPEC-HUD-001", "SPEC-HUD-002", "SPEC-LCY-007"]
depends_on = ["REQ-BLK-006"]
sources = ["DEC-BLK-009"]
