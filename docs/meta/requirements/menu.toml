schema = "requirement-set"
domain = "menu"
domain_code = "MENU"

[[requirements]]
id = "REQ-MENU-001"
title = "メニューから抑止を開始・解除できる"
kind = "functional"
statement = "利用者は、メニューバーのアイコンのメニューから抑止を開始し、解除できる。"
reason = "常駐アプリの基本の操作として、いつでも手の届く場所から切り替えられるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-MENU-001", "SPEC-BLK-011"]
depends_on = []
sources = ["DEC-UI-001"]

[[requirements]]
id = "REQ-MENU-002"
title = "メニューで今回の解除条件を選べる"
kind = "functional"
statement = "利用者は、メニューから抑止を開始するときと抑止中に、今回の時間の解除条件としてタイマー、指定時刻、時間の条件を持たないことを選べる。抑止中は、選んだ条件で時間の解除条件を置き換えられる。"
reason = "設定を変えずに、その場だけの時間で止められるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-MENU-002", "SPEC-MENU-003"]
depends_on = ["REQ-BLK-006"]
sources = ["DEC-BLK-009", "DEC-MENU-004"]

[[requirements]]
id = "REQ-MENU-003"
title = "メニューで抑止の状態と解除の条件を確かめられる"
kind = "functional"
statement = "利用者は、メニューを開くと、抑止中かどうかと、抑止中なら解除の条件を確かめられる。"
reason = "いつ解除されるかを、操作する前に確かめられるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-MENU-004"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-MENU-004"
title = "メニューバーのアイコンで Capsaicin を見つけられる"
kind = "quality"
statement = "メニューバーに Capsaicin のアイコンを既定で表示し、抑止中かどうかをアイコンの見た目で示す。VoiceOver ではアイコンのラベルとして抑止の状態を読み上げる。"
reason = "メニューの入口を見つけられるようにし、Caps Lock の LED が見えないときや画面を見ない利用者にも状態を伝えるため。"
priority = "must"
status = "accepted"
specs = ["SPEC-MENU-005"]
depends_on = []
sources = []

[[requirements]]
id = "REQ-MENU-005"
title = "メニューバーのアイコンを隠せる"
kind = "functional"
statement = "利用者は、設定でメニューバーのアイコンを隠せる。隠している間もアプリは動き続け、利用者は設定画面を開くことと、アプリを終了することができる。"
reason = "ホットキー、LED、CLI だけで使う利用者が、メニューバーの場所を空けられるようにするため。"
priority = "should"
status = "accepted"
specs = ["SPEC-MENU-006", "SPEC-SET-001", "SPEC-SET-004"]
depends_on = ["REQ-SET-002"]
sources = ["DEC-UI-010"]

[[requirements]]
id = "REQ-MENU-006"
title = "Dock にアイコンを表示できる"
kind = "functional"
statement = "利用者は、設定で Dock にアプリのアイコンを表示できる。表示している間は、Dock と ⌘Tab のアプリの切り替えで、アプリが動いていることを確かめられる。"
reason = "常駐アプリが動いていることを、メニューバーを探さずに Dock で確かめたい利用者がいるため。"
priority = "could"
status = "accepted"
specs = ["SPEC-MENU-007"]
depends_on = ["REQ-SET-002"]
sources = []

[[requirements]]
id = "REQ-MENU-007"
title = "メニューからスリープとディスプレイの設定を切り替えられる"
kind = "functional"
statement = "利用者は、メニューから設定の「スリープとディスプレイ」の項目を切り替えられる。"
reason = "抑止中に設定画面を開かずに切り替えるため。"
priority = "should"
status = "accepted"
specs = ["SPEC-MENU-008"]
depends_on = ["REQ-SET-001"]
sources = ["DEC-MENU-004"]
