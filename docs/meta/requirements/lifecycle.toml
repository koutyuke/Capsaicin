schema = "requirement-set"
domain = "lifecycle"
domain_code = "LCY"

[[requirements]]
id = "REQ-LCY-001"
title = "ログイン時に起動できる"
kind = "functional"
statement = "「ログイン時に起動」がオンのとき、利用者がログインするとアプリが起動する。"
reason = "常駐アプリとして、毎回手で起動しなくても使えるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-LCY-001"]
depends_on = []
sources = ["DEC-LCY-010"]

[[requirements]]
id = "REQ-LCY-002"
title = "終了時にスリープ設定と LED を元に戻す"
kind = "functional"
statement = "アプリが終了するときは、Capsaicin が適用した抑止の仕組みを停止中のあるべき状態に合わせる。合わせられないときのエラーのダイアログは、利用者の終了でだけ出す。"
reason = "アプリが動いていないのに、スリープできない状態や LED の点灯を残さないため。"
priority = "must"
status = "accepted"
specs = ["SPEC-LCY-002"]
depends_on = []
sources = ["DEC-BLK-008", "DEC-LCY-010"]

[[requirements]]
id = "REQ-LCY-003"
title = "後片付けをできずに終わっても disablesleep を残さない"
kind = "functional"
statement = "アプリがクラッシュなどで後片付けをできずに終わっても、Capsaicin が立てた disablesleep はデーモンが戻す。LED と輝度は次の起動で戻す。"
reason = "アプリが動かなくなった後に、利用者が気づきにくいスリープの禁止を残さないため。"
priority = "must"
status = "accepted"
specs = ["SPEC-LCY-003", "SPEC-LCY-006", "SPEC-HLP-002"]
depends_on = []
sources = ["DEC-LCY-010", "EVID-HLP-010", "EVID-HLP-012", "EVID-HLP-013", "EVID-LCY-007", "EVID-BLK-015"]

[[requirements]]
id = "REQ-LCY-006"
title = "同じアプリは1つだけ動く"
kind = "functional"
statement = "同じ bundle ID のアプリは1つだけ動く。後から起動したものは、動いているものを開き直して終了する。"
reason = "抑止を止めずに設定を開けるようにし、複数のプロセスが LED、輝度、ヘルパーや CLI の通信を取り合うのを防ぐため。"
priority = "must"
status = "accepted"
specs = ["SPEC-LCY-009"]
depends_on = []
sources = ["DEC-LCY-011"]
