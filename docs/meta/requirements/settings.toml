schema = "requirement-set"
domain = "settings"
domain_code = "SET"

[[requirements]]
id = "REQ-SET-001"
title = "すべての設定項目を個別に切り替えられる"
kind = "functional"
statement = "利用者は、設定画面のすべての項目を、ほかの項目とまとめずに1つずつ切り替えられる。"
reason = "設定の結果を項目ごとに予測できるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-SET-002"]
depends_on = []
sources = ["DEC-SET-001", "DEC-SET-002"]

[[requirements]]
id = "REQ-SET-002"
title = "設定画面を macOS のシステム設定と同じ構成にする"
kind = "quality"
statement = "設定画面は、左のサイドバーでセクションを選び、右側に選んだセクションの項目を並べる、macOS のシステム設定と同じ構成にする。"
reason = "macOS の利用者が、使い方を覚えずに目的の項目にたどり着けるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-SET-001", "SPEC-SET-009"]
depends_on = []
sources = ["EVID-UI-003", "DEC-UI-010", "DEC-SET-008"]

[[requirements]]
id = "REQ-SET-003"
title = "項目名だけで内容が伝わる"
kind = "quality"
statement = "設定の各項目は、項目名だけで内容が伝わり、名前だけでは結果が分かりにくい項目では、項目名の下の説明文で補う。"
reason = "画面を簡潔に保ちつつ、誤解しやすい項目で設定を誤らないようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-SET-003"]
depends_on = []
sources = ["DEC-UI-002", "DEC-UI-016"]

[[requirements]]
id = "REQ-SET-004"
title = "バージョンとビルド番号を確かめられる"
kind = "functional"
statement = "利用者は、設定画面の「このアプリについて」でバージョンとビルド番号を確かめられる。"
reason = "動いているビルドを特定できるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-SET-004"]
depends_on = []
sources = ["DEC-UI-010"]

[[requirements]]
id = "REQ-SET-005"
title = "設定の値と止まる範囲が分かる"
kind = "functional"
statement = "設定画面の「スリープ」の「スリープとディスプレイ」は、各行の値がそのまま追加で止まる範囲を表し、設定を適用できない場合はその理由を示す。"
reason = "利用者が設定した値から、止まる範囲と使えない理由を読み取れるようにするため。"
priority = "must"
status = "accepted"
specs = ["SPEC-SET-005"]
depends_on = []
sources = ["DEC-BLK-006", "DEC-SET-006", "DEC-BLK-008"]

[[requirements]]
id = "REQ-SET-006"
title = "その Mac にない機能の項目を表示しない"
kind = "functional"
statement = "MacBook 以外の Mac ではディスプレイの開閉に関する項目を、内蔵バッテリーのない Mac ではバッテリーに関する項目を表示しない。"
reason = "使えない項目の理由を読み解く手間をなくすため。"
priority = "must"
status = "accepted"
specs = ["SPEC-SET-006", "SPEC-BLK-012"]
depends_on = []
sources = ["DEC-BLK-006", "HYP-SET-001", "HYP-SET-002"]

[[requirements]]
id = "REQ-SET-007"
title = "アプリからリポジトリと同梱するコードのライセンスを開ける"
kind = "functional"
statement = "利用者は、アプリの中からリポジトリを開き、Capsaicin と同梱するコードのライセンスの全文を読める。"
reason = "ソースの公開先と、利用するコードの条件をアプリから確かめられるようにするため。"
priority = "should"
status = "accepted"
specs = ["SPEC-SET-004", "SPEC-SET-008"]
depends_on = []
sources = ["DEC-SYS-019", "DEC-UI-014"]
