schema = "requirement-set"
domain = "system"
domain_code = "SYS"

[[requirements]]
id = "REQ-SYS-001"
title = "macOS 26 以降で動く"
kind = "constraint"
statement = "Capsaicin は macOS 26 以降で動き、macOS 25 以前には対応しない。"
reason = "対応範囲を絞った理由は DEC-SYS-003 にある。"
priority = "must"
status = "accepted"
specs = []
depends_on = []
sources = ["DEC-SYS-003", "HYP-SYS-001"]

[[requirements]]
id = "REQ-SYS-002"
title = "Apple Silicon の Mac で動く"
kind = "constraint"
statement = "Capsaicin は Apple Silicon の Mac で動き、Intel Mac には対応しない。"
reason = "対応範囲を絞った理由は DEC-SYS-003 にある。"
priority = "must"
status = "accepted"
specs = []
depends_on = []
sources = ["DEC-SYS-003"]

[[requirements]]
id = "REQ-SYS-003"
title = "アプリの表示は日本語、CLI の出力は英語"
kind = "constraint"
statement = "Capsaicin の画面に表示する文字列は日本語だけで、CLI の出力は英語だけである。"
reason = "アプリの表示言語の判断は DEC-SYS-002、CLI の出力の言語の判断は DEC-CLI-003 にある。"
priority = "must"
status = "accepted"
specs = []
depends_on = []
sources = ["DEC-SYS-002", "DEC-CLI-003"]

[[requirements]]
id = "REQ-SYS-004"
title = "あとから言語を追加できる"
kind = "quality"
statement = "アプリの画面に表示する文字列は String Catalog で管理し、あとから言語を追加できる。CLI の出力は対象外とする。"
reason = "将来ほかの言語の利用者に配る場合に備えるため。"
priority = "must"
status = "accepted"
specs = ["SPEC-UI-011"]
depends_on = []
sources = ["DEC-SYS-002", "DEC-SYS-007", "DEC-CLI-003"]

[[requirements]]
id = "REQ-SYS-005"
title = "Apple Developer Program なしでビルドして使える"
kind = "constraint"
statement = "v1 は、Apple Developer Program に加入せずに、自分の Mac でソースからビルドして使える。"
reason = "加入しない判断は DEC-SYS-004 にある。"
priority = "must"
status = "accepted"
specs = []
depends_on = []
sources = ["DEC-SYS-004", "DEC-SYS-005"]

[[requirements]]
id = "REQ-SYS-006"
title = "コード署名に依存しない"
kind = "constraint"
statement = "Capsaicin の機能は、Apple が発行した証明書によるコード署名がなくても動く。"
reason = "将来ほかの人に無料で配る場合にも、同じ方式のまま動くようにするため。"
priority = "must"
status = "accepted"
specs = []
depends_on = []
sources = ["DEC-SYS-004", "DEC-HLP-001", "DEC-CLI-002", "HYP-HLP-003"]

[[requirements]]
id = "REQ-SYS-007"
title = "Capsomnia と共有しない"
kind = "constraint"
statement = "Capsaicin は、既存の類似アプリ Capsomnia（MIT ライセンス）とコード、名前、アイコンを共有しない。"
reason = "Capsomnia とは別のアプリとして、独立して作るため。"
priority = "must"
status = "accepted"
specs = []
depends_on = []
sources = []
